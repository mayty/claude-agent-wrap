# This file has been edited with the assistance of an AI tool.
name: check

on:
  push:
    branches: [master, release/*]
  pull_request:
    branches: [master, release/*]

permissions:
  contents: read

jobs:
  # Runs on the exact interpreter users get, provisioned the exact way they
  # provision it — so the bootstrap is exercised on every push and cannot rot
  # unnoticed. No setup-python and no version matrix: bin/agent execs one pinned
  # interpreter, so testing any other would be testing something nobody runs.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provision the pinned CPython
        run: ./bin/agent-bootstrap --dev

      - name: Run checks
        run: make check

  # The only thing that exercises aarch64, Darwin, and the BSD userland the
  # bootstrap has to cope with: the arm64 -> aarch64 name difference, `shasum`
  # standing in for `sha256sum`, and BSD `mv`. Non-blocking for now — it is here
  # to report on a platform that has never been tested, not to gate merges on it.
  bootstrap-macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Provision the pinned CPython
        run: ./bin/agent-bootstrap --dev

      - name: Verify the pin resolved
        run: make python-check

      - name: Run tests
        run: make test
