# This file has been created with the assistance of an AI tool.
#
# LiteLLM proxy config for the agent-wrap shared sidecar.
#
# Phase 1: Bedrock passthrough only. Claude Code already speaks the Bedrock
# Runtime protocol; we forward /bedrock/* verbatim. The proxy authenticates the
# inbound request against ${LITELLM_MASTER_KEY} (presented as a Bearer token in
# place of the SigV4 header) and uses its own AWS_REGION_NAME and
# AWS_BEARER_TOKEN_BEDROCK env vars to reach Bedrock upstream.
#
# Phase 2 (Langfuse) will only need to flip on the callback below and pass
# LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST into the sidecar
# container. No structural change here.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

  # Custom passthrough for the Bedrock control plane. Claude Code calls
  # GET /bedrock/inference-profiles?type=SYSTEM_DEFINED at startup to
  # populate its model picker; LiteLLM's built-in /bedrock/* runtime
  # handler only knows /model/<id>/invoke* shapes and 400s on this URL.
  # We shim it through to the real Bedrock control-plane endpoint and
  # swap the inbound LiteLLM bearer for the AWS bearer token configured
  # on the sidecar.
  pass_through_endpoints:
    - path: "/bedrock/inference-profiles"
      target: "https://bedrock.us-east-1.amazonaws.com/inference-profiles"
      include_subpath: true
      headers:
        Authorization: "Bearer os.environ/AWS_BEARER_TOKEN_BEDROCK"

# Wildcard route so any Bedrock model ID (including inference profiles like
# `us.anthropic.claude-opus-4-7`) resolves through /bedrock/model/<id>/invoke*
# without enumerating each model. `aws_region_name` falls through to the
# AWS_REGION_NAME env var set on the sidecar container.
model_list:
  - model_name: "*"
    litellm_params:
      model: "bedrock/*"

