# This file has been created with the assistance of an AI tool.
#
# LiteLLM proxy config for the agent-wrap shared sidecar.
#
# Bedrock passthrough only. Claude Code already speaks the Bedrock Runtime
# protocol; we forward /bedrock/* verbatim. The proxy authenticates the inbound
# request against ${LITELLM_MASTER_KEY} (presented as a Bearer token in place of
# the SigV4 header) and uses its own AWS_REGION_NAME and AWS_BEARER_TOKEN_BEDROCK
# env vars to reach Bedrock upstream.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# Wildcard route so any Bedrock model ID (including inference profiles like
# `us.anthropic.claude-opus-4-7`) resolves through /bedrock/model/<id>/invoke*
# without enumerating each model. `aws_region_name` falls through to the
# AWS_REGION_NAME env var set on the sidecar container.
model_list:
  - model_name: "*"
    litellm_params:
      model: "bedrock/*"

# Log every request/response to a JSONL file (mounted from the host by the
# provider lifecycle). See litellm_runtime/callback.py.
litellm_settings:
  callbacks: callback.file_logger_instance
