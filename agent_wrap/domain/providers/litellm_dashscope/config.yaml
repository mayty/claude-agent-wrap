# This file has been created with the assistance of an AI tool.
#
# LiteLLM proxy config for the agent-wrap shared sidecar.
#
# DashScope (Alibaba Cloud) passthrough. The proxy authenticates the inbound
# request against ${LITELLM_MASTER_KEY} and uses its own DASHSCOPE_API_KEY
# and DASHSCOPE_API_BASE env vars to reach DashScope upstream.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# Log every request/response to a JSONL file (mounted from the host by the
# provider lifecycle). See litellm_runtime/callback.py.
litellm_settings:
  callbacks: callback.file_logger_instance

model_list:
  - model_name: "*"
    litellm_params:
      model: "anthropic/*"
      api_base: https://dashscope-intl.aliyuncs.com/apps/anthropic/v1/messages
      api_key: os.environ/DASHSCOPE_API_KEY
