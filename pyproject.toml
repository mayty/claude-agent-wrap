# This file has been created with the assistance of an AI tool.

[project]
name = "agent-wrap"
version = "0.0.0"
requires-python = "==3.14.7"
# First-degree runtime dependencies, as ranges. Exact versions live in uv.lock and
# in the exported bin/requirements.txt -- never here. See CLAUDE.md for the flow.
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "dockerfile-parse>=2.0.1",
    "filelock>=3.32.5",
    "httpx2>=2.12.0",
    "humanize>=4.16.0",
    "packaging>=26.3",
    "psutil>=7.2.2",
    "rich>=15.0.0",
    "watchdog>=6.0.0",
]

# ---------------------------------------------------------------------------
# uv (dependency resolution -- developer machines and CI only)
# ---------------------------------------------------------------------------
[tool.uv]
# The project is never installed: bin/agent puts the checkout on PYTHONPATH, and an
# installed copy in site-packages would shadow it. Declaring this is also what lets
# uv lock a project that deliberately carries no [build-system].
package = false
# A cooldown, not a pin: a release has to survive a week on PyPI before this project
# will resolve to it. Deliberately declared here rather than in a uv.toml or on the
# command line, so every developer machine and CI resolve against the same value.
exclude-newer = "7 days"

# Floors only, like the runtime dependencies above: uv.lock pins the exact versions and
# exclude-newer holds back anything younger than a week, so an upper bound would gate
# nothing here -- it would only stop `make upgrade-deps` from ever seeing a new major.
# `make upgrade-deps` rewrites these floors, so each one records what was last locked.
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.5",
    "pyrefly>=1.2.0",
    "tomlkit>=0.15.1",
    # dockerfile-parse and psutil ship no py.typed; every other runtime dependency does.
    "types-dockerfile-parse>=2.0.0.20260508",
    "types-psutil>=7.2.2.20260906",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest]
testpaths = ["agent_wrap", "scripts"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--tb=short",
    "--strict-markers",
]
markers = []

# ---------------------------------------------------------------------------
# ruff (linter + formatter)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["."]
extend-exclude = [".python"]

# The two regions that do not run on the pinned interpreter, at the version each
# actually runs on. Both the linter and the formatter honour these, so a plain
# `ruff check .` / `ruff format .` is correct for the whole tree: at py314 the
# formatter strips the parentheses from `except (A, B):` -- legal since PEP 758, and
# a SyntaxError on anything older, which litellm_runtime/ still has to be.
# statusline.py is listed even though its target currently equals the global one: a
# base image bump moves it, and it must follow that interpreter rather than this file.
# See the Makefile for the floors and how to re-read them.
[tool.ruff.per-file-target-version]
"ops/statusline.py" = "py314"
"agent_wrap/domain/providers/litellm_runtime/**" = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflicts with formatter
    "W191",
    "E111",
    "E114",
    "E117",
    "D206",
    "D300",
    "Q000",
    "Q001",
    "Q002",
    "Q003",
    "COM812",
    "COM819",
    "ISC001",
    "ISC002",

    # Type annotations handled by pyrefly
    "ANN",

    # Copyright
    "CPY001",

    # Docstring style -- formatter handles
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D107",
    "D400",
    "D415",
    "D203",
    "D205",
    "D212",

    # Line length handled by formatter
    "E501",

    # Shebang check
    "EXE002",

    # TODO tracking
    "FIX002",
    "TD002",
    "TD003",

    # Key in dict style
    "SIM118",

    # Use of `assert` detected -- allowed project-wide
    "S101",

    # --- Project-specific ---

    # subprocess calls to docker/git are core functionality; inputs are controlled
    "S603",
    "S607",
    "PLW1510",

    # open() needed for fd-based APIs (fcntl.flock)
    "PTH123",

    # Scripts invoked via `python3 script.py`, not direct execution
    "EXE001",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "PLR2004", # magic values in test assertions
    "SLF001",  # private member access needed for testing internals
    "S105",    # hardcoded strings in test data are fine
    "PLR0917", # fixture-injected params, not a real positional API
]
"agent_wrap/containers.py" = [
    "PLC0415", # local imports in @cached_property methods are the ONE exception
]
"ops/statusline.py" = [
    "BLE001", # broad except Exception -- statusline must never crash
]
"agent_wrap/domain/providers/litellm_runtime/**" = [
    "INP001",  # not a package — plain dir of files mounted into the sidecar container
    "TC001",   # imports from the parent package are runtime dependencies in sidecar context
    "TC002",   # same — sidecar-deployed files import at runtime, not just type-checking
    "T201",    # EC001 forbids importing agent_wrap here, so DisplayService is unreachable
]
"scripts/**" = [
    "INP001",  # individual scripts, not package
    "T201",    # standalone host-side linters; importing their own subject would couple them
]
# Every remaining T201 exemption below is an output path that deliberately does not go
# through DisplayService. Everywhere else, user-facing output must use it.
"agent_wrap/domain/display/service.py" = [
    "T201",    # the display layer itself -- these prints are the abstraction
]
"agent_wrap/domain/display/spinner.py" = [
    "T201",    # ditto: the spinner writes its own frames to stderr
]

[tool.ruff.lint.isort]
known-first-party = ["agent_wrap"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# setuptools
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["agent_wrap*"]

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["agent_wrap"]
branch = true
omit = [
    "*/tests/*",
    "*/conftest.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# pyrefly (Meta's type checker)
# ---------------------------------------------------------------------------
[tool.pyrefly]
preset = "strict"
project_includes = [
    "agent_wrap",
    "ops/statusline.py",
    "scripts",
]
# No project_excludes for litellm_runtime/: `make typecheck` runs `pyrefly check .`,
# and an explicit path argument makes pyrefly ignore project_excludes entirely, so
# those entries never took effect. The directory's flat sys.path imports are covered
# by inline `# type: ignore` comments in the files themselves instead.
python_version = "3.14"
min-severity = "info"

[tool.pyrefly.errors]
